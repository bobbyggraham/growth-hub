<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Shot — Performance Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:ital,wght@0,400;0,600;0,700;1,500;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-navy: #0b1421;
    --dark-navy: #133865;
    --brand-blue: #365aa0;
    --steel-blue: #718dbc;
    --light-blue: #c5d9fa;
    --gold: #ebb018;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--deep-navy);
    color: var(--light-blue);
    font-family: 'Barlow', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    text-align: center;
    padding: 44px 24px 10px;
  }
  .kicker {
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold);
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: clamp(40px, 8vw, 72px); letter-spacing: 0.06em;
    color: #fff; text-transform: uppercase; line-height: 1;
  }
  .sub { margin-top: 10px; color: var(--steel-blue); font-size: 15px; }

  .controls {
    display: flex; align-items: center; gap: 18px;
    margin: 28px 0 8px;
  }
  #playBtn {
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--deep-navy); background: var(--gold);
    border: none; border-radius: 8px; padding: 15px 38px; cursor: pointer;
  }
  #playBtn:hover { background: #f5c23a; }
  .bpm {
    font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--steel-blue);
  }
  .beat-dots { display: flex; gap: 8px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(113,141,188,0.35);
    transition: background 0.05s, transform 0.05s;
  }
  .dot.on { background: var(--gold); transform: scale(1.4); }

  .stage {
    width: 100%; max-width: 820px;
    padding: 24px 24px 80px;
  }
  .block-label {
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold);
    margin: 34px 0 10px; text-align: center;
  }
  .line {
    font-family: 'Barlow', sans-serif; font-style: italic; font-weight: 500;
    font-size: clamp(19px, 3.2vw, 26px);
    text-align: center;
    color: rgba(197, 217, 250, 0.4);
    padding: 7px 12px; border-radius: 8px;
    transition: color 0.15s, background 0.15s, transform 0.15s;
  }
  .line.hook-line { font-weight: 700; }
  .line.active {
    color: #fff;
    background: rgba(19, 56, 101, 0.6);
    transform: scale(1.03);
    box-shadow: inset 4px 0 0 var(--gold);
  }
  .line.done { color: var(--steel-blue); }

  footer {
    margin-top: auto;
    border-top: 1px solid rgba(113,141,188,0.25);
    width: 100%; text-align: center; padding: 26px;
    color: var(--steel-blue); font-size: 12px;
    font-family: 'Oswald', sans-serif; letter-spacing: 0.12em; text-transform: uppercase;
  }
  footer span { color: var(--gold); }
</style>
</head>
<body>

<header>
  <div class="kicker">Growth Hub &bull; Performance Mode</div>
  <h1>One Shot</h1>
  <div class="sub">Original FSG beat &bull; lyrics light up on tempo &bull; you bring the voice</div>
  <div style="max-width: 620px; margin: 20px auto 0; padding: 0 24px;">
    <div style="background: rgba(19,56,101,0.55); border: 1px solid rgba(113,141,188,0.35); border-top: 3px solid var(--gold); border-radius: 12px; padding: 16px 20px; text-align: left;">
      <div style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px;">&#9654; The Full Track</div>
      <audio controls preload="metadata" style="width: 100%; display: block;">
        <source src="one-shot.m4a" type="audio/mp4">
        Your browser can't play this audio.
      </audio>
    </div>
  </div>
</header>

<div class="controls">
  <button id="playBtn">&#9654; Drop the Beat</button>
  <div class="bpm">86 BPM</div>
  <div class="beat-dots">
    <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
  </div>
</div>

<div class="stage" id="stage"></div>

<footer>Growth Hub <span>&bull;</span> FSG <span>&bull;</span> Closers Take the Shot</footer>

<script>
// ---------- Lyrics: [barsFromStart, text, isHook, blockLabel] ----------
// 4-bar count-in, then one bar per line.
const LINES = [
  { bar: 4,  text: "Boots on the street, badge in the lobby," , label: "Verse 1" },
  { bar: 5,  text: "Engagement is cold, but the pipeline's my hobby." },
  { bar: 6,  text: "Prospect's on the fence and the quarter's closing fast," },
  { bar: 7,  text: "Prep did the work — now the pitch has to last." },
  { bar: 8,  text: "No script gonna save you when the buyer goes quiet," },
  { bar: 9,  text: "Know the account cold, let the numbers be the riot." },
  { bar: 10, text: "International, one crew, one creed —" },
  { bar: 11, text: "We light up facilities AND the whole damn world." },
  { bar: 12, text: "You get one walk-through, one seat at the table,", hook: true, label: "The Hook" },
  { bar: 13, text: "Own the room, stay humble, stay hungry, stay able.", hook: true },
  { bar: 14, text: "The moment shows up — you don't let it slide,", hook: true },
  { bar: 15, text: "Closers take the shot. Everyone else step aside.", hook: true },
  { bar: 16, text: "Protect. Land. Expand. — that's the code we live,", label: "The Creed" },
  { bar: 17, text: "Contribution plus Service — that's the Value we give." },
  { bar: 18, text: "The client is the Hero, we're the Guide with the light," },
  { bar: 19, text: "Show 'em the path, then we build it right." },
  { bar: 20, text: "You get one walk-through, one seat at the table,", hook: true, label: "The Hook — Bring It Home" },
  { bar: 21, text: "Own the room, stay humble, stay hungry, stay able.", hook: true },
  { bar: 22, text: "The moment shows up — you don't let it slide,", hook: true },
  { bar: 23, text: "CLOSERS TAKE THE SHOT. EVERYONE ELSE STEP ASIDE.", hook: true },
];
const TOTAL_BARS = 25; // a bar of outro

// ---------- Render lyric lines ----------
const stage = document.getElementById('stage');
LINES.forEach((l, i) => {
  if (l.label) {
    const lab = document.createElement('div');
    lab.className = 'block-label';
    lab.textContent = l.label;
    stage.appendChild(lab);
  }
  const div = document.createElement('div');
  div.className = 'line' + (l.hook ? ' hook-line' : '');
  div.id = 'line-' + i;
  div.textContent = l.text;
  stage.appendChild(div);
});

// ---------- Audio engine (original trap-style beat, Web Audio) ----------
const BPM = 86;
const SPB = 60 / BPM;          // seconds per beat
const BAR = SPB * 4;           // 4/4, halftime feel
let ctx = null, playing = false, startTime = 0, schedTimer = null, uiTimer = null;
let nextStep = 0;              // 16th-note steps
const STEP = SPB / 4;

// 808 pattern: D minor, gliding subs — [step-in-2-bars, Hz, glide?]
const E808 = { D1: 36.71, F1: 43.65, C1: 32.70, A0: 27.50, G1: 49.00 };
const BASSLINE = [
  [0,  E808.D1], [7,  E808.D1], [10, E808.F1, true],
  [16, E808.C1], [23, E808.C1], [26, E808.G1, true], [30, E808.A0, true]
];
// dark pluck riff (Dm), 2-bar loop — [step, Hz]
const PLUCK = [
  [0, 587.33], [3, 440.00], [6, 523.25], [11, 440.00],
  [16, 587.33], [19, 698.46], [22, 523.25], [27, 440.00]
];

function noiseBuffer(c) {
  const b = c.createBuffer(1, c.sampleRate * 1.2, c.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
let NOISE = null, master = null, crunch = null;

function clipCurve(k) {
  const n = 256, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    c[i] = Math.tanh(k * x);
  }
  return c;
}
function buildChain() {
  master = ctx.createDynamicsCompressor();
  master.threshold.value = -14; master.ratio.value = 5;
  master.attack.value = 0.003; master.release.value = 0.2;
  master.connect(ctx.destination);
  crunch = ctx.createWaveShaper();          // grit bus for the 808s — hard drive
  crunch.curve = clipCurve(7);
  const crunchOut = ctx.createGain(); crunchOut.gain.value = 0.8;
  crunch.connect(crunchOut).connect(master);
}

// Boomy 808 kick — hard click + deep sub drop
function kick(t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(230, t);
  o.frequency.exponentialRampToValueAtTime(33, t + 0.08);
  g.gain.setValueAtTime(1.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
  o.connect(g).connect(crunch);
  o.start(t); o.stop(t + 0.6);
  const c = ctx.createBufferSource(); c.buffer = NOISE;      // click
  const cf = ctx.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 3500;
  const cg = ctx.createGain();
  cg.gain.setValueAtTime(0.25, t);
  cg.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
  c.connect(cf).connect(cg).connect(master);
  c.start(t); c.stop(t + 0.03);
}
// Snare + clap layered (trap backbeat)
function snare(t) {
  const s = ctx.createBufferSource(); s.buffer = NOISE;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.8;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  s.connect(f).connect(g).connect(master);
  s.start(t); s.stop(t + 0.24);
  // clap flams
  [0, 0.012, 0.026].forEach((d, i) => {
    const cs = ctx.createBufferSource(); cs.buffer = NOISE;
    const cf = ctx.createBiquadFilter(); cf.type = 'highpass'; cf.frequency.value = 1200;
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(i === 2 ? 0.4 : 0.22, t + d);
    cg.gain.exponentialRampToValueAtTime(0.001, t + d + 0.1);
    cs.connect(cf).connect(cg).connect(master);
    cs.start(t + d); cs.stop(t + d + 0.12);
  });
  const o = ctx.createOscillator(), og = ctx.createGain();  // body
  o.frequency.value = 180;
  og.gain.setValueAtTime(0.28, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(og).connect(master);
  o.start(t); o.stop(t + 0.1);
}
function hat(t, open, vol) {
  const s = ctx.createBufferSource(); s.buffer = NOISE;
  const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8200;
  const g = ctx.createGain();
  const dur = open ? 0.22 : 0.045;
  g.gain.setValueAtTime(vol ?? (open ? 0.2 : 0.14), t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(master);
  s.start(t); s.stop(t + dur + 0.02);
}
// Gliding 808 bass through the grit bus
let last808 = E808.D1;
function bass808(t, hz, glide) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine';
  if (glide) {
    o.frequency.setValueAtTime(last808, t);
    o.frequency.exponentialRampToValueAtTime(hz, t + 0.09);
  } else {
    o.frequency.setValueAtTime(hz, t);
  }
  last808 = hz;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(1.05, t + 0.012);
  g.gain.setValueAtTime(1.05, t + SPB * 0.8);
  g.gain.exponentialRampToValueAtTime(0.001, t + SPB * 1.7);
  o.connect(g).connect(crunch);
  o.start(t); o.stop(t + SPB * 1.75);
}
// Dark pluck riff
function pluck(t, hz) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'triangle'; o.frequency.value = hz;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(3200, t);
  f.frequency.exponentialRampToValueAtTime(500, t + 0.25);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.16, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
  // slap-back echo
  const dl = ctx.createDelay(); dl.delayTime.value = STEP * 3;
  const dg = ctx.createGain(); dg.gain.value = 0.3;
  o.connect(g); g.connect(f); f.connect(master);
  f.connect(dl); dl.connect(dg); dg.connect(master);
  o.start(t); o.stop(t + 0.4);
}
// Riser through the count-in, impact at the drop
function riser(t, dur) {
  const s = ctx.createBufferSource(); s.buffer = NOISE; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(300, t);
  f.frequency.exponentialRampToValueAtTime(6000, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.22, t + dur * 0.9);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(master);
  s.start(t); s.stop(t + dur + 0.05);
}
function impact(t) {
  // the bass drop: sub dives from 110Hz to the floor and hangs there
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(110, t);
  o.frequency.exponentialRampToValueAtTime(26, t + 0.9);
  g.gain.setValueAtTime(1.3, t);
  g.gain.setValueAtTime(1.3, t + 0.7);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
  o.connect(g).connect(crunch);
  o.start(t); o.stop(t + 1.65);
  // second detuned sub for width/growl
  const o2 = ctx.createOscillator(), g2 = ctx.createGain();
  o2.frequency.setValueAtTime(112, t);
  o2.frequency.exponentialRampToValueAtTime(27, t + 0.9);
  g2.gain.setValueAtTime(0.7, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
  o2.connect(g2).connect(crunch);
  o2.start(t); o2.stop(t + 1.45);
  // dark noise crash
  const s = ctx.createBufferSource(); s.buffer = NOISE;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(4000, t);
  f.frequency.exponentialRampToValueAtTime(300, t + 0.9);
  const sg = ctx.createGain();
  sg.gain.setValueAtTime(0.55, t);
  sg.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
  s.connect(f).connect(sg).connect(master);
  s.start(t); s.stop(t + 1.05);
}

function scheduleStep(step, t) {
  const inBar = step % 16;               // 16th within bar
  const bar = Math.floor(step / 16);
  const in2 = step % 32;                 // step within 2-bar loop

  // count-in: sparse kicks + riser, drop hits at bar 4
  if (bar < 4) {
    if (inBar === 0) kick(t);
    if (inBar % 4 === 2) hat(t, false, 0.08);
    if (step === 0) riser(startTime, BAR * 4);
    return;
  }
  if (step === 64) impact(t);            // the drop
  if (step === 320) impact(t);           // second drop into the final hook (bar 20)
  if (bar === 19 && inBar >= 12) return; // beat cuts out for the last beat before it — silence, then slam

  // trap halftime: kicks syncopated, snare on beat 3
  if (inBar === 0 || inBar === 7 || inBar === 10) kick(t);
  if (inBar === 8) snare(t);

  // hats: every 16th, accented 8ths, 32nd roll into the bar turn, open hat end of 2-bar loop
  const accent = inBar % 4 === 0 ? 0.17 : (inBar % 2 === 0 ? 0.13 : 0.08);
  if (inBar === 14) {                    // roll: four 32nds
    for (let r = 0; r < 4; r++) hat(t + r * STEP / 2, false, 0.1 + r * 0.02);
  } else if (in2 === 31) {
    hat(t, true);
  } else {
    hat(t, false, accent);
  }

  // 808s follow the kicks with glides
  BASSLINE.forEach(([s, hz, gl]) => { if (in2 === s) bass808(t, hz, gl); });

  // pluck riff rides on top
  PLUCK.forEach(([s, hz]) => { if (in2 === s) pluck(t, hz); });
}

function scheduler() {
  while (startTime + nextStep * STEP < ctx.currentTime + 0.15) {
    const t = startTime + nextStep * STEP;
    const bar = Math.floor(nextStep / 16);
    if (bar >= TOTAL_BARS) { stop(); return; }
    scheduleStep(nextStep, t);
    nextStep++;
  }
}

function uiLoop() {
  if (!playing) return;
  const elapsed = ctx.currentTime - startTime;
  const bar = elapsed / BAR;
  const beat = Math.floor((elapsed / SPB) % 4);
  for (let i = 0; i < 4; i++)
    document.getElementById('d' + i).classList.toggle('on', i === beat);

  let activeIdx = -1;
  LINES.forEach((l, i) => { if (bar >= l.bar) activeIdx = i; });
  LINES.forEach((l, i) => {
    const el = document.getElementById('line-' + i);
    el.classList.toggle('active', i === activeIdx && bar < l.bar + 1);
    el.classList.toggle('done', bar >= l.bar + 1);
  });
  if (activeIdx >= 0) {
    const el = document.getElementById('line-' + activeIdx);
    const r = el.getBoundingClientRect();
    if (r.top < 100 || r.bottom > window.innerHeight - 120)
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  uiTimer = requestAnimationFrame(uiLoop);
}

function start() {
  if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); NOISE = noiseBuffer(ctx); buildChain(); }
  last808 = E808.D1;
  ctx.resume();
  playing = true;
  nextStep = 0;
  startTime = ctx.currentTime + 0.1;
  document.getElementById('playBtn').innerHTML = '&#9632; Stop';
  schedTimer = setInterval(scheduler, 40);
  uiLoop();
}
function stop() {
  playing = false;
  clearInterval(schedTimer);
  cancelAnimationFrame(uiTimer);
  document.getElementById('playBtn').innerHTML = '&#9654; Drop the Beat';
  document.querySelectorAll('.line').forEach(el => el.classList.remove('active', 'done'));
  document.querySelectorAll('.dot').forEach(el => el.classList.remove('on'));
}
document.getElementById('playBtn').addEventListener('click', () => playing ? stop() : start());
</script>

</body>
</html>
